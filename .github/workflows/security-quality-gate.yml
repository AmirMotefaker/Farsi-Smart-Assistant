name: Security quality gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Run JavaScript syntax checks
        run: npm run check

      - name: Run deterministic security and product tests
        run: npm test

      - name: Run Persian evaluation metrics
        run: npm run eval
