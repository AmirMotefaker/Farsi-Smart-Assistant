<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>تنظیمات دستیار هوشمند فارسی</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body class="options-page">
    <main class="options-shell">
        <header class="options-header">
            <span class="eyebrow">Farsi Smart Assistant</span>
            <h1>تنظیمات</h1>
            <p>واژه‌های شخصی و اصلاحات ذخیره‌شده را مدیریت کنید.</p>
        </header>

        <nav class="options-nav" aria-label="بخش‌های مدیریت">
            <span class="options-nav-item is-active" aria-current="page">تنظیمات</span>
            <a class="options-nav-item" href="site_management.html">مدیریت سایت‌ها</a>
        </nav>

        <div class="options-grid single-column">
            <section class="setting-section">
                <h2>دیکشنری شخصی</h2>
                <p>هر اصلاح را در یک خط و به فرم «عبارت اشتباه = عبارت درست» وارد کنید.</p>
                <label class="sr-only" for="customDictionary">دیکشنری شخصی</label>
                <textarea id="customDictionary" spellcheck="false"></textarea>
                <button id="saveDictionaryButton" class="main-button-style" type="button">
                    ذخیره دیکشنری
                </button>
            </section>
        </div>

        <div id="confirmation" class="confirmation options-confirmation" aria-live="polite"></div>
    </main>

    <script src="options.js"></script>
</body>
</html>
